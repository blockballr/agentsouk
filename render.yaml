# Render blueprint for Agent Souk: the persistent-server alternative to the
# split Vercel (API) + Cloudflare Pages (SPA) deployment.
# Nothing here runs until you create the services in the dashboard. The live
# submission keeps serving from Vercel until the operator points DNS here.
# See docs/serve-alternative.md for the switch procedure and the tradeoffs.
#
# Start command. next.config.ts sets output: "standalone" whenever VERCEL is
# unset, which is every non-Vercel host. Next 16 refuses `next start` in that
# mode, so the entry point is .next/standalone/server.js. The build copies
# public and .next/static into the standalone tree, which the standalone server
# does not do by itself.

services:
  # backend: the Next.js app in the repo root. One process holds the in-memory
  # catalogue shelf (src/lib/scanner.ts) and the x402 ledger (src/lib/x402.ts).
  - type: web
    name: agent-souk-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build && cp -r public .next/standalone/ && cp -r .next/static .next/standalone/.next/
    startCommand: node .next/standalone/server.js
    # health check and keep-alive target: /api/chain reads only the configured
    # target chain and its settlement asset, so a frequent ping costs no upstream
    # call. /api/stats talks to 8004scan and must not be pinged on a timer.
    healthCheckPath: /api/chain
    envVars:
      - key: NODE_VERSION
        value: "22"
      # the standalone server binds process.env.HOSTNAME; Docker sets it to the
      # container id, which is not a bindable address, so pin it
      - key: HOSTNAME
        value: 0.0.0.0
      # network selector read by src/lib/types.ts targetChainId(). 97 is BSC
      # testnet (the current product), 56 is mainnet. Unset falls back to 56, so
      # set it explicitly to avoid deploying the wrong network.
      - key: TARGET_CHAIN
        value: "97"
      # settlement rail read by src/app/api/x402/settle/route.ts. sandbox
      # records a receipt and moves no funds; prod relays with RELAY_PRIVATE_KEY;
      # b402 uses B402_CLIENT_ID and B402_ACCESS_TOKEN. Set this to prod for the
      # live API: the Vercel deployment runs prod, and sandbox here would look
      # healthy while quietly settling nothing on chain.
      - key: FACILITATOR_MODE
        value: prod
      # 8004scan tier key, read by src/lib/scanner.ts and the snapshot builder
      - key: EIGHT004_API_KEY
        sync: false
      # guards the snapshot build and the scout routes
      - key: INDEX_SECRET
        sync: false
      # signs authorizations in prod mode and pays gas; also the verifier key in
      # src/app/api/cron/verify/route.ts
      - key: RELAY_PRIVATE_KEY
        sync: false
      - key: B402_CLIENT_ID
        sync: false
      - key: B402_ACCESS_TOKEN
        sync: false
      # durable Postgres. Both are required: src/lib/durable-store.ts and
      # src/lib/receipts-store.ts only use the database when
      # RECEIPTS_STORE=postgres, so DATABASE_URL alone leaves tasks, jobs and
      # receipts in per-instance memory and they are lost on restart. Reuse the
      # same database the Vercel deployment writes to, or claims and receipts
      # do not carry over.
      - key: DATABASE_URL
        sync: false
      - key: RECEIPTS_STORE
        value: postgres
      # CORS allowlist for src/proxy.ts, comma separated. Only needed while the
      # SPA stays on a different origin. Same-origin serving makes it moot.
      - key: WEB_ORIGIN
        value: https://agentsouk.xyz,https://agent-souk-web.onrender.com
      # absolute origin used for the permanent registration URI in
      # src/app/api/agents/register/prepare/route.ts and by the cron routes.
      # VERCEL_URL is unset here, so both must be set or they fall back to
      # localhost:3000. Change to the custom domain once DNS points here.
      - key: PUBLIC_API_URL
        value: https://agent-souk-api.onrender.com
      - key: BASE_URL
        value: https://agent-souk-api.onrender.com
      # bearer secret for GET /api/cron/verify and /api/cron/refresh
      - key: CRON_SECRET
        sync: false
      - key: VERIFY_LIMIT
        value: "40"
      # optional RPC overrides read by src/lib/rpc.ts; blank uses the defaults in
      # packages/core/src/rpc.ts. Set these if the public endpoints rate limit.
      - key: BSC_MAINNET_RPC_URL
        sync: false
      - key: BSC_TESTNET_RPC_URL
        sync: false
      - key: REGISTRY_RPC_URL
        sync: false
      # ERC-1271 smart-account verification is experimental and off by default
      - key: SMART_WALLET_VERIFY
        value: "off"
      # optional feature secrets. Leave blank to disable email, boosts and the
      # compare commentary; the app degrades instead of failing.
      - key: BOOST_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      # the code default; override with your verified sender when email is on
      - key: NOTIFY_FROM
        value: Agent Souk <onboarding@resend.dev>
      - key: LLM_EVAL_API_KEY
        sync: false
      - key: LLM_EVAL_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_EVAL_MODEL
        value: gemini-2.5-flash
      - key: LLM_EVAL_FALLBACK_MODEL
        value: gemini-2.0-flash

  # frontend: the vite app as a static site. Kept as the split deployment until
  # the SPA is served from the API origin (see docs/serve-alternative.md).
  - type: web
    name: agent-souk-web
    runtime: static
    rootDir: apps/web
    buildCommand: cd ../.. && npm ci && npm run build --workspace @agora/web
    staticPublishPath: ../../apps/web/dist
    envVars:
      # baked in at build time by Vite, so a change needs a rebuild
      - key: VITE_API_URL
        value: https://agent-souk-api.onrender.com/api
      # WalletConnect project id; without it the wallet-connect path is disabled
      - key: VITE_WC_PROJECT_ID
        sync: false
      - key: VITE_BSC_MAINNET_RPC_URL
        sync: false
      - key: VITE_BSC_TESTNET_RPC_URL
        sync: false
    routes:
      # the spa uses client routing; everything unknown falls back to index
      - type: rewrite
        source: /*
        destination: /index.html

  # nightly verifier pass. Calls the API route rather than the local script,
  # because the route writes verdicts to the durable store
  # (src/lib/verifications-store.ts) while scripts/verifier-loop.mjs only writes
  # its own container's filesystem, which a separate API service never reads.
  - type: cron
    name: agent-souk-verifier
    runtime: node
    schedule: "0 6 * * *"
    command: >-
      node -e "fetch(process.env.BASE_URL + '/api/cron/verify',
      { headers: { Authorization: 'Bearer ' + process.env.CRON_SECRET } })
      .then(async (r) => { const t = await r.text(); console.log(r.status, t);
      if (!r.ok) process.exit(1); })
      .catch((e) => { console.error(e); process.exit(1); })"
    envVars:
      - key: BASE_URL
        value: https://agent-souk-api.onrender.com
      - key: CRON_SECRET
        sync: false
