name: Sweep the shelf

# Verification verdicts go stale within days while the Vercel cron fires once
# daily, and a stale badge next to a live unreachable error is exactly what the
# brief forbids. This runs the same fail-closed sweep route every four hours so
# fresh listings and changed endpoints get re-probed without waiting on the
# daily tick. Each run spends at most ten 2 sUSD hires plus gas from the relay,
# so roughly 120 sUSD a day at most; the route's own budget and candidate cap
# bound it. Listings also enqueue themselves at confirmation, so a successful
# listing is swept on the next run without waiting for the schedule at all.
#
# NOTE: scheduled workflows only fire from the default branch. This file does
# nothing until it exists on main; a branch copy is inert.

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API to sweep the shelf
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository"
            exit 1
          fi
          code=$(curl -sS -o report.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 280 \
            https://api.agentsouk.xyz/api/cron/verify)
          echo "http $code"
          cat report.json
          if [ "$code" != "200" ]; then
            echo "the sweep did not succeed"
            exit 1
          fi
