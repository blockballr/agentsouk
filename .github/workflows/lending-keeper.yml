name: Lending keeper

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  decide:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the keeper for its decision
        env:
          ACCOUNT: ${{ secrets.LENDING_ACCOUNT }}
        run: |
          account="${ACCOUNT:-0xd34d0fB4E27B6f944a9FdE29A168C9fd9a5FBC2c}"
          echo "account: $account"
          curl -fsS --max-time 60 "https://api.agentsouk.xyz/api/lending/keeper?account=$account" | tee decision.json
          echo
          node -e "const r=require('./decision.json'); console.log(r.decision.action, '|', r.decision.reason)"
