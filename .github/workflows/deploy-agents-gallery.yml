name: Deploy agents gallery

# The gallery is a separate static Pages project, not the marketplace SPA.
# agentsouk-agents and its custom domain are created once; this workflow keeps
# the project in step with the checked-in files.
on:
  push:
    branches: [main]
    paths:
      - "apps/agents/**"
      - ".github/workflows/deploy-agents-gallery.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy the gallery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy apps/agents --project-name agentsouk-agents --branch main
