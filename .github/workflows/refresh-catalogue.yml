name: Refresh the catalogue

# The shelf's freshness must not depend on a deploy. The catalogue is refreshed on
# a schedule by calling the API's own refresh route, which is fail-closed and
# answers only to the bearer secret. Scheduled here rather than with Vercel cron
# so the cadence is not limited by the hosting plan, and so every refresh leaves a
# run in this repository's history.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API to refresh the catalogue
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository"
            exit 1
          fi
          code=$(curl -sS -o report.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 280 \
            https://api.agentsouk.xyz/api/cron/refresh)
          echo "http $code"
          cat report.json
          if [ "$code" != "200" ]; then
            echo "the catalogue refresh did not succeed"
            exit 1
          fi
      - name: Ask the API to sync the registry from chain
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # our own indexer: decode the ERC-8004 events off chain 56 and admit
          # what passes the shelf gate, independent of any third party index
          code=$(curl -sS -o sync.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 280 \
            "https://api.agentsouk.xyz/api/cron/registry-sync?blocks=4000")
          echo "http $code"
          cat sync.json
          if [ "$code" != "200" ]; then
            echo "the registry sync did not succeed"
            exit 1
          fi
