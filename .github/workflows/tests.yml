name: Tests

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json --pretty false
      - name: Typecheck web
        run: npx tsc --noEmit -p apps/web/tsconfig.app.json --pretty false
      - name: Tests
        run: npx vitest run
      - name: Install foundry
        uses: foundry-rs/foundry-toolchain@v1
      - name: Contract tests
        working-directory: contracts
        run: forge test
