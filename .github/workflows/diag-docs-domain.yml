name: Diag docs domain

# Read-only diagnostic: zones visible to the token, Pages domain detail for
# docs.agentsouk.xyz, and the zone DNS records for the host.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zones, Pages domain detail, DNS records
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CF_TOKEN"
          BASE="https://api.cloudflare.com/client/v4"

          echo "zones visible to this token:"
          curl -sS -H "$AUTH" "$BASE/zones?per_page=50" \
            | jq -r '.result[]? | "  \(.id) name=\(.name) status=\(.status)"'

          echo "pages domain detail on agentsouk-docs:"
          curl -sS -H "$AUTH" \
            "$BASE/accounts/$CF_ACCOUNT/pages/projects/agentsouk-docs/domains/docs.agentsouk.xyz" \
            | jq -c '{success, errors, result}'

          ZONE=$(curl -sS -H "$AUTH" "$BASE/zones?name=agentsouk.xyz" | jq -r '.result[0].id // empty')
          echo "zone id: ${ZONE:-not found}"

          if [ -n "$ZONE" ]; then
            echo "dns records for docs.agentsouk.xyz:"
            curl -sS -H "$AUTH" "$BASE/zones/$ZONE/dns_records?name=docs.agentsouk.xyz&per_page=100" \
              | jq -r '.result[]? | "  \(.id) type=\(.type) content=\(.content) proxied=\(.proxied)"'
          fi
