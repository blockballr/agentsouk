name: Diag docs domain

# Read-only diagnostic: DNS records in the zone for docs.agentsouk.xyz and
# any record that could be catching the host, using the zone_tag reported by
# the Pages domain detail.
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Zone DNS records for docs host
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CF_TOKEN"
          ZONE="25bbb0d097145477d0d6ad8277dd14c8"

          echo "pages domain detail on agentsouk-docs:"
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/agentsouk-docs/domains/docs.agentsouk.xyz" \
            | jq -c '{success, errors, result}'

          echo "dns records named docs.agentsouk.xyz:"
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=docs.agentsouk.xyz&per_page=100" \
            | jq -c '{success, errors, result}'

          echo "all records that could catch the host (docs or wildcard):"
          curl -sS -H "$AUTH" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?per_page=100" \
            | jq -c '{success, errors, result: [.result[]? | select(.name == "docs.agentsouk.xyz" or (.name | startswith("*"))) | {id, name, type, content, proxied}]}'
