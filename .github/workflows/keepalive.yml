name: Keep warm

# A persistent host can still idle a web service, and a cold start shows a
# loading screen to the first visitor after a quiet spell. This pings every ten
# minutes so a reviewer always meets a warm instance.
#
# /api/chain is the ping target on purpose: it reads only the configured chain
# and its settlement asset, so a frequent ping costs no upstream call. Do not
# point this at /api/stats, which talks to 8004scan.
#
# Set the repository variable LIVE_URL to the deployed origin, no trailing
# slash, for example https://agent-souk-api.onrender.com. Until it is set this
# workflow does nothing.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    if: ${{ vars.LIVE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the live origin
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 60 "${{ vars.LIVE_URL }}/api/chain" || echo "000")
          echo "LIVE_URL -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "warning: keep-alive got HTTP $code from ${{ vars.LIVE_URL }}/api/chain"
          fi
