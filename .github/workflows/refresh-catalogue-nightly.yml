name: Refresh the catalogue (nightly full pull)

# A deeper pull than the 15-minute refresh: covers more pages so the in-memory
# shelf tracks the live registry rather than only the committed snapshot. Runs
# once a night; a failed run leaves the previous catalogue in place.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the API to refresh the catalogue (full)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set on this repository"
            exit 1
          fi
          code=$(curl -sS -o report.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 290 \
            https://api.agentsouk.xyz/api/cron/refresh-full)
          echo "http $code"
          cat report.json
          if [ "$code" != "200" ]; then
            echo "the nightly catalogue refresh did not succeed"
            exit 1
          fi
