name: Text hygiene

# Guards the tree against mojibake, which is UTF-8 read as cp1252 and written
# back. It once grew a tracked file to 8 MB of noise, and the local pre-commit
# gate only protects commits that go through it, so this runs on every push and
# pull request to catch anything that skips the gate.
permissions:
  contents: read
  statuses: write

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  text:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for mojibake in tracked text files
        run: node scripts/check-text.mjs
      - name: Report commit status
        if: always()
        run: |
          state="${{ job.status == 'success' && 'success' || 'failure' }}"
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "{\"state\":\"$state\",\"description\":\"Text hygiene $state\",\"context\":\"text-hygiene\"}"
