name: Warm API

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: warm-api
  cancel-in-progress: true

permissions: {}

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the read paths a visitor waits on
        run: |
          curl -fsS --max-time 30 "https://api.agentsouk.xyz/api/agents?chainId=56" > /dev/null
          curl -fsS --max-time 30 "https://api.agentsouk.xyz/api/agents/56/376593" > /dev/null
      - name: Warm the shelf for today and tomorrow
        run: |
          today=$(node -e "process.stdout.write(Math.floor(Date.now()/86400000).toString(36))")
          tomorrow=$(node -e "process.stdout.write(Math.floor(Date.now()/86400000+1).toString(36))")
          for seed in "$today" "$tomorrow"; do
            curl -fsS --max-time 90 "https://api.agentsouk.xyz/api/agents?type=jobs&metric=score&limit=48&seed=$seed" > /dev/null || true
          done
