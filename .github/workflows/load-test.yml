# Manual cloud-sourced load test. It deploys the temporary Worker in
# scripts/cloud-load, fans invocations out from a GitHub runner, and always
# deletes the Worker afterwards unless an existing worker_url is supplied.
# This workflow only takes effect after it is pushed to the default branch.

name: Cloud load test

on:
  workflow_dispatch:
    inputs:
      worker_url:
        description: "Existing worker base URL. Leave empty to deploy and then delete a temporary one."
        required: false
        default: ""
      rungs:
        description: "Comma separated effective concurrency ladder"
        required: false
        default: "25,50,100,250"
      duration_ms:
        description: "Per-invocation run window in milliseconds"
        required: false
        default: "2200"
      max_requests:
        description: "Subrequest cap per invocation, 50 is the Free plan ceiling"
        required: false
        default: "40"

jobs:
  load:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy temporary worker
        id: deploy
        if: inputs.worker_url == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          wrangler deploy --config scripts/cloud-load/wrangler.toml | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -n1)
          test -n "$url"
          echo "worker_url=$url" >> "$GITHUB_OUTPUT"

      - name: Run load test
        env:
          WORKER_URL: ${{ inputs.worker_url != '' && inputs.worker_url || steps.deploy.outputs.worker_url }}
          RUNGS: ${{ inputs.rungs }}
          DURATION_MS: ${{ inputs.duration_ms }}
          MAX_REQUESTS: ${{ inputs.max_requests }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/cloud-load/run.mjs | tee results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-load-results
          path: results.json

      - name: Delete temporary worker
        if: always() && inputs.worker_url == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler delete --config scripts/cloud-load/wrangler.toml --force
