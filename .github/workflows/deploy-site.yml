name: Deploy site

# Publishes the Vite app to Cloudflare Pages on every push that touches it, so
# the site keeps up with the API, which Vercel already deploys on push.
#
# Inert until the repository variable PAGES_CI is set to "on", because it needs
# two secrets first: CLOUDFLARE_API_TOKEN with Pages edit permission, and
# CLOUDFLARE_ACCOUNT_ID. The gate is a variable rather than the secret itself,
# because a secret is not available to a job-level condition.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch: {}

jobs:
  pages:
    if: ${{ vars.PAGES_CI == 'on' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        # npm install rather than npm ci: the committed lock is not in sync with
        # package.json (missing @base-org/account@2.5.13, brotli-wasm@3.0.1,
        # ox@0.6.9, https-proxy-agent@5.0.1, agent-base@6.0.2, and axios and
        # @coinbase/cdp-sdk pinned below what package.json asks for), so a clean
        # ci install fails on any host. This regenerates in place and proceeds.
        # Regenerate the lock properly and switch this back to npm ci.
        run: npm install --no-audit --no-fund
      - name: Build the site
        run: npm run build --workspace @agora/web
      - name: Publish to Cloudflare Pages
        # run from apps/web so the Pages Function under apps/web/functions is
        # picked up, which is what proxies /api to the API origin
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy dist --project-name agentsouk
