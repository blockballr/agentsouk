name: health watch

# The guard has to look even when nobody opens the app. Vercel Hobby allows only
# a daily cron, so the ten minute watch runs here instead; the daily session
# renewal stays in vercel.json.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: health-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: call the watcher
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set as a repository secret; skipping."
            exit 0
          fi
          curl -sS -f --max-time 240 \
            "https://api.agentsouk.xyz/api/cron/health" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -o response.json
          cat response.json
