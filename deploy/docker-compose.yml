# Agent Souk full-stack deployment for Oracle VPS (Ubuntu arm64)
# Services: nginx (marketplace + /api proxy), Next backend, Postgres, Redis
# Build context is the repo root; Dockerfiles live in ./deploy

services:
  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - EIGHT004_API_KEY=${EIGHT004_API_KEY}
      - FACILITATOR_MODE=${FACILITATOR_MODE}
      - B402_CLIENT_ID=${B402_CLIENT_ID}
      - B402_ACCESS_TOKEN=${B402_ACCESS_TOKEN}
      - INDEX_SECRET=${INDEX_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
    expose:
      - "3000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  pgdata:
