app = "hirespree-backend"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.backend"
  context = ".."

[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  FACILITATOR_MODE = "sandbox"

# Set secrets with: fly secrets set EIGHT004_API_KEY=... B402_CLIENT_ID=... B402_ACCESS_TOKEN=... INDEX_SECRET=... DATABASE_URL=... REDIS_URL=...
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
