app = "hirespree"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile.frontend"
  context = ".."
  [build.args]
    VITE_API_URL = "/api"
    SITE_URL = "https://hirespree.fly.dev"

[env]
  BACKEND_HOST = "hirespree-backend.internal"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
