<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">The vault band</title>
  <desc id="desc">The buyer deposit stays in the vault contract, the agent trades inside a band and loss cap, and the buyer can withdraw at any time.</desc>
  <rect width="1200" height="420" rx="18" fill="#070914"/>
  <text x="40" y="52" fill="#4f5cff" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">VAULT / HIREVAULT</text>
  <text x="40" y="88" fill="#d1e4fa" font-family="Space Grotesk, Inter, sans-serif" font-size="29">The deposit stays in the vault, not the agent's wallet.</text>

  <g font-family="Inter, sans-serif">
    <rect x="40" y="128" width="430" height="228" rx="12" fill="#0c0f1d" stroke="#2a3550"/>
    <text x="60" y="162" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1.4">CUSTODY</text>
    <rect x="60" y="182" width="150" height="66" rx="8" fill="#111629" stroke="#2a3550"/>
    <text x="135" y="209" text-anchor="middle" fill="#d1e4fa" font-size="17">Buyer</text>
    <text x="135" y="230" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5">deposit</text>
    <path d="M218 215h44" stroke="#6bd6c2" stroke-width="2"/>
    <path d="M262 215l-7-4v8z" fill="#6bd6c2"/>
    <rect x="270" y="182" width="170" height="66" rx="8" fill="#111629" stroke="#6bd6c2"/>
    <text x="355" y="209" text-anchor="middle" fill="#d1e4fa" font-size="17">HireVault</text>
    <text x="355" y="230" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5">holds the balance</text>
    <text x="60" y="286" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1.2">BUYER CAN</text>
    <text x="60" y="306" fill="#d1e4fa" font-size="16">withdraw or close at any time</text>
    <text x="60" y="334" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1.2">AGENT CANNOT</text>
    <text x="60" y="354" fill="#d1e4fa" font-size="16">move the deposit outside trade()</text>

    <rect x="500" y="128" width="660" height="228" rx="12" fill="#0c0f1d" stroke="#2a3550"/>
    <text x="524" y="162" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5" letter-spacing="1.4">THE BAND</text>
    <text x="1136" y="162" text-anchor="end" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="11.5">stored price</text>

    <rect x="590" y="190" width="530" height="92" fill="rgba(107,214,194,0.07)"/>
    <line x1="590" y1="190" x2="1120" y2="190" stroke="#269684" stroke-dasharray="4 4"/>
    <line x1="590" y1="282" x2="1120" y2="282" stroke="#269684" stroke-dasharray="4 4"/>
    <line x1="590" y1="318" x2="1120" y2="318" stroke="#e46d4c" stroke-dasharray="4 4"/>

    <text x="578" y="194" text-anchor="end" fill="#269684" font-family="JetBrains Mono, monospace" font-size="11.5">ceiling</text>
    <text x="578" y="286" text-anchor="end" fill="#269684" font-family="JetBrains Mono, monospace" font-size="11.5">floor</text>
    <text x="578" y="322" text-anchor="end" fill="#e46d4c" font-family="JetBrains Mono, monospace" font-size="11.5">loss cap</text>

    <polyline points="590,258 660,250 730,264 800,238 870,244 940,222 1010,232 1080,210" fill="none" stroke="#4f5cff" stroke-width="2.5"/>
    <circle cx="1080" cy="210" r="5" fill="#4f5cff"/>
    <text x="1092" y="214" fill="#d1e4fa" font-family="JetBrains Mono, monospace" font-size="12">now</text>

    <text x="590" y="340" fill="#8d99ad" font-size="14">The agent trades inside the band. The loss cap is the hard floor.</text>
  </g>

  <text x="40" y="392" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="13">The buyer keeps the exit. The agent never holds the deposit.</text>
</svg>
