<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">The escrow job lifecycle</title>
  <desc id="desc">A seller quote is funded into the ERC-8183 escrow, delivered on chain, held through the dispute window and released.</desc>
  <rect width="1200" height="360" rx="18" fill="#070914"/>
  <text x="40" y="52" fill="#4f5cff" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2">JOB / ERC-8183</text>
  <text x="40" y="88" fill="#d1e4fa" font-family="Space Grotesk, Inter, sans-serif" font-size="29">The money is committed before the work, released against it.</text>

  <rect x="300" y="112" width="760" height="36" rx="18" fill="rgba(91,108,255,0.07)" stroke="#2c3568" stroke-dasharray="4 5"/>
  <text x="680" y="135" text-anchor="middle" fill="#4f5cff" font-family="JetBrains Mono, monospace" font-size="12.5" letter-spacing="1.2">THE KERNEL ESCROW HOLDS THE MONEY</text>

  <line x1="90" y1="196" x2="1050" y2="196" stroke="#2a3550" stroke-width="2"/>
  <g font-family="Inter, sans-serif">
    <g>
      <circle cx="90" cy="196" r="20" fill="#0c0f1d" stroke="#4f5cff" stroke-width="2"/>
      <text x="90" y="202" text-anchor="middle" fill="#d1e4fa" font-family="JetBrains Mono, monospace" font-size="13">01</text>
      <text x="90" y="164" text-anchor="middle" fill="#d1e4fa" font-size="18">Quote</text>
      <text x="90" y="242" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="12">seller signs</text>
    </g>
    <g>
      <circle cx="330" cy="196" r="20" fill="#4f5cff" stroke="#9aa6ff" stroke-width="2"/>
      <text x="330" y="202" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13">02</text>
      <text x="330" y="164" text-anchor="middle" fill="#d1e4fa" font-size="18">Fund</text>
      <text x="330" y="242" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="12">escrow</text>
    </g>
    <g>
      <circle cx="570" cy="196" r="20" fill="#0c0f1d" stroke="#4f5cff" stroke-width="2"/>
      <text x="570" y="202" text-anchor="middle" fill="#d1e4fa" font-family="JetBrains Mono, monospace" font-size="13">03</text>
      <text x="570" y="164" text-anchor="middle" fill="#d1e4fa" font-size="18">Deliver</text>
      <text x="570" y="242" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="12">on chain</text>
    </g>
    <g>
      <circle cx="810" cy="196" r="20" fill="#0c0f1d" stroke="#4f5cff" stroke-width="2"/>
      <text x="810" y="202" text-anchor="middle" fill="#d1e4fa" font-family="JetBrains Mono, monospace" font-size="13">04</text>
      <text x="810" y="164" text-anchor="middle" fill="#d1e4fa" font-size="18">Window</text>
      <text x="810" y="242" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="12">dispute</text>
    </g>
    <g>
      <circle cx="1050" cy="196" r="20" fill="#269684" stroke="#6bd6c2" stroke-width="2"/>
      <text x="1050" y="202" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13">05</text>
      <text x="1050" y="164" text-anchor="middle" fill="#d1e4fa" font-size="18">Release</text>
      <text x="1050" y="242" text-anchor="middle" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="12">paid</text>
    </g>
  </g>

  <text x="40" y="320" fill="#8d99ad" font-family="JetBrains Mono, monospace" font-size="13">A funded job is visible to anyone reading the chain.</text>
</svg>
